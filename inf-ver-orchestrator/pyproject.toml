[project]
name = "inf-ver-orchestrator"
version = "0.1.0"
description = "Spawns/reaps per-model inf-ver-runner Jobs + verifier vLLMs from the ledger's pending verification events"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "kubernetes>=29.0.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "respx>=0.21",
]

[tool.ruff]
line-length = 120
