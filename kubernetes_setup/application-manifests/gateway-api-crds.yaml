# Gateway API standard CRDs — prerequisite for KServe LLMInferenceService's
# managed router (Gateway/HTTPRoute) and for istio's Gateway API support.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api-crds
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/kubernetes-sigs/gateway-api.git
    targetRevision: v1.5.1
    path: config/crd
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false # CRDs — never auto-prune
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
