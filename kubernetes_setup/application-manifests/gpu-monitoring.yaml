apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gpu-monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/<org>/<repo>.git
    targetRevision: main
    path: manifests/gpu-monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: gpu-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
