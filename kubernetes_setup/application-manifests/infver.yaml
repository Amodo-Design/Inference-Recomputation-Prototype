apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infver
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/<org>/<repo>.git
    targetRevision: main
    path: manifests/infver
  destination:
    server: https://kubernetes.default.svc
    namespace: infver
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
