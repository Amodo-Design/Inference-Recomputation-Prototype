apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: local-storage
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/<org>/<repo>.git
    targetRevision: main
    path: manifests/local-storage
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false # never auto-delete PersistentVolumes
      selfHeal: true
