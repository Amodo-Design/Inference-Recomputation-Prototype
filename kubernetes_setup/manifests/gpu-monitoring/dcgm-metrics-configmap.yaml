# Custom DCGM exporter metric set (extends the default with DCP profiling
# metrics). The GPU Operator only uses this once its ClusterPolicy points at
# it — the operator is not managed by this repo, so apply once by hand:
#
#   kubectl patch clusterpolicy cluster-policy --type merge \
#     -p '{"spec":{"dcgmExporter":{"config":{"name":"dcgm-metrics-custom"}}}}'
#
# The operator then restarts the dcgm-exporter DaemonSet with this metric list.
# Note: DCGM_FI_PROF_* (profiling/DCP) metrics require datacenter-class GPUs;
# on unsupported GPUs those series are simply absent.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dcgm-metrics-custom
  namespace: gpu-operator
data:
  dcgm-metrics.csv: |
    DCGM_FI_DEV_GPU_UTIL, gauge, GPU utilization (in %)
    DCGM_FI_DEV_FB_USED, gauge, Framebuffer memory used (in MiB)
    DCGM_FI_DEV_GPU_TEMP, gauge, GPU temperature (in C)
    DCGM_FI_DEV_POWER_USAGE, gauge, Power draw (in W)
    DCGM_FI_PROF_GR_ENGINE_ACTIVE, gauge, Ratio of time the graphics engine is active
    DCGM_FI_PROF_SM_OCCUPANCY, gauge, The ratio of number of warps resident on an SM
    DCGM_FI_PROF_PIPE_TENSOR_ACTIVE, gauge, The ratio of cycles the any tensor pipe is active
    DCGM_FI_PROF_PIPE_FP64_ACTIVE, gauge, Ratio of cycles the fp64 pipe is active
    DCGM_FI_PROF_PIPE_FP32_ACTIVE, gauge, Ratio of cycles the fp32 pipe is active
    DCGM_FI_PROF_PIPE_FP16_ACTIVE, gauge, Ratio of cycles the fp16 pipe is active (does not include HMMA)
    DCGM_FI_PROF_PIPE_TENSOR_HMMA_ACTIVE, gauge, Ratio of cycles the tensor (HMMA / fp16-bf16 matmul) pipe is active
    DCGM_FI_PROF_PIPE_TENSOR_IMMA_ACTIVE, gauge, Ratio of cycles the tensor (IMMA / integer matmul) pipe is active
    DCGM_FI_DEV_SM_CLOCK, gauge, SM clock for the device
    DCGM_FI_DEV_MAX_SM_CLOCK, gauge, Maximum supported SM clock for the device
