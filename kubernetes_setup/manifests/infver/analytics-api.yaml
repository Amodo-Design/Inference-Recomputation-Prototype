apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-api
  labels:
    app: analytics-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics-api
  template:
    metadata:
      labels:
        app: analytics-api
    spec:
      containers:
        - name: analytics-api
          image: harbor.infver.local/infver_images/analytics-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8400
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: infver-secrets
                  key: DATABASE_URL
            - name: GPU_ENRICHER_URL
              value: http://gpu-enricher:8300
          readinessProbe:
            httpGet:
              path: /health
              port: 8400
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8400
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-api
spec:
  selector:
    app: analytics-api
  ports:
    - port: 8400
      targetPort: 8400
