apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-enricher
  labels:
    app: gpu-enricher
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gpu-enricher
  template:
    metadata:
      labels:
        app: gpu-enricher
    spec:
      containers:
        - name: gpu-enricher
          image: harbor.infver.local/infver_images/gpu-enricher:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8300
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: infver-secrets
                  key: DATABASE_URL
            # Enables GPU enrichment from Prometheus/DCGM. Verify the service
            # name with:
            #   kubectl -n monitoring get svc | grep prometheus
            - name: PROMETHEUS_URL
              value: http://kube-prometheus-stack-prometheus.monitoring:9090
          readinessProbe:
            httpGet:
              path: /health
              port: 8300
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8300
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: gpu-enricher
spec:
  selector:
    app: gpu-enricher
  ports:
    - port: 8300
      targetPort: 8300
