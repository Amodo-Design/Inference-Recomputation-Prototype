apiVersion: apps/v1
kind: Deployment
metadata:
  name: inf-ver-ui
  labels:
    app: inf-ver-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inf-ver-ui
  template:
    metadata:
      labels:
        app: inf-ver-ui
    spec:
      containers:
        - name: inf-ver-ui
          image: harbor.infver.local/infver_images/inf-ver-ui:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            # Consumed server-side only (Next.js API routes), so internal
            # service URLs are correct here.
            - name: LEDGER_API_URL
              value: http://ledger-api:8000
            - name: PROMPT_RUNNER_URL
              value: http://prompt-runner:8200
            - name: ANALYTICS_API_URL
              value: http://analytics-api:8400
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: inf-ver-ui
spec:
  selector:
    app: inf-ver-ui
  ports:
    - port: 3000
      targetPort: 3000
