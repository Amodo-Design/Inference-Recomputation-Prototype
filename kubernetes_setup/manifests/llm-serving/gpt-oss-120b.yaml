# openai/gpt-oss-120b served by vLLM, with the verify-tap sidecar.
# Same shape as gpt-oss-20b.yaml — see that file and qwen2-5-7b-instruct.yaml
# for the port and command-override rationale.
#
# Choose a GPU pool that supports the model's quantization and has enough
# memory for weights and the requested context/concurrency. Add a nodeSelector
# for your cluster as needed, and tune the example resource requests below.
apiVersion: serving.kserve.io/v1alpha1
kind: LLMInferenceService
metadata:
  name: gpt-oss-120b
spec:
  model:
    uri: hf://openai/gpt-oss-120b
    name: openai/gpt-oss-120b
  replicas: 1
  template:
    containers:
      - name: main # vLLM — internal only
        image: vllm/vllm-openai:v0.25.1
        securityContext:
          runAsNonRoot: false
        command:
          - /bin/bash
          - -c
          - >-
            exec vllm serve /mnt/models
            --served-model-name openai/gpt-oss-120b
            --port 8001
            --disable-uvicorn-access-log
            --max-model-len 8192
        ports:
          - containerPort: 8001
        env:
          # Model Runner V2 (vLLM default since v0.22 for dense generate
          # models) samples with a stateless Triton kernel that difr's
          # verifier cannot replay; the V1 runner's per-request Philox
          # stream is the verification contract. Pin V1 explicitly.
          - name: VLLM_USE_V2_MODEL_RUNNER
            value: "0"
        resources:
          requests:
            cpu: "8"
            memory: 72Gi
            nvidia.com/gpu: "1"
          limits:
            memory: 96Gi
            nvidia.com/gpu: "1"
      - name: verify-tap # sidecar — takes the pod's real serving port
        image: harbor.infver.local/infver_images/inf-proxy:latest
        imagePullPolicy: Always
        ports:
          - containerPort: 8000
        env:
          - name: INF_PROXY_MODEL_BASE_URL
            value: http://localhost:8001/v1
          - name: INF_PROXY_MODEL_HOSTNAME
            value: kserve-gpt-oss-120b
          # This sidecar shares the pod with the serving vLLM, so its own
          # identity IS the serving pod's — recorded on every tap message
          # for per-pod GPU attribution in the ledger.
          - name: INF_PROXY_POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: INF_PROXY_NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
          - name: INF_PROXY_MESSAGE_WRITER_URL
            value: http://message-writer:8100
          # Pinned sampling contract — all four required (see qwen file).
          - name: INF_PROXY_SEED
            value: "42"
          - name: INF_PROXY_TEMPERATURE
            value: "1.0"
          - name: INF_PROXY_TOP_K
            value: "200"
          - name: INF_PROXY_TOP_P
            value: "0.95"
          - name: INF_PROXY_DECLARE
            value: "true"
          - name: INF_PROXY_LEDGER_API_URL
            value: http://ledger-api:8000
  router:
    gateway:
      refs:
        - name: llm-gateway
          namespace: infver
    route: {}
    scheduler: {}
---
# EPP ext-proc TLS — see qwen2-5-7b-instruct.yaml for why this is required.
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: gpt-oss-120b-epp-tls
spec:
  host: gpt-oss-120b-epp-service.infver.svc.cluster.local
  trafficPolicy:
    tls:
      mode: SIMPLE
      insecureSkipVerify: true
