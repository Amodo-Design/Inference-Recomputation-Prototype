# =============================================================================
# Statically provisioned local PersistentVolumes.
#
# The `local-storage` StorageClass uses `kubernetes.io/no-provisioner`, so a
# PersistentVolume must exist ahead of time for every PersistentVolumeClaim.
#
# Every PV carries a `claimRef` reserving it for one specific PVC. Without
# this, Kubernetes binds any Available PV of sufficient size to any pending
# PVC, and workloads end up on each other's volumes (and nodes).
# The claimRef names must match the PVC names the charts/manifests generate —
# if a release name or chart version changes the PVC names, update them here.
#
# Example node placement: monitoring -> gpu-node-1, Harbor -> gpu-node-2,
# Kubeflow + Inference Verification -> gpu-node-3. Adjust the `kubernetes.io/hostname`
# values to rebalance.
#
# IMPORTANT — before syncing this application, create each `local.path`
# directory on the assigned node:
#   sudo ./scripts/create-local-storage-dirs.sh   (run on the node)
#
# Reclaim policy is Retain: deleting a PVC never wipes the data on disk.
# =============================================================================
---
# --- Monitoring (kube-prometheus-stack) --------------------------------------
apiVersion: v1
kind: PersistentVolume
metadata:
  name: monitoring-prometheus
  labels:
    app.kubernetes.io/part-of: infver-platform
spec:
  capacity:
    storage: 60Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    namespace: monitoring
    name: prometheus-kube-prometheus-stack-prometheus-db-prometheus-kube-prometheus-stack-prometheus-0
  local:
    path: /mnt/local-storage/monitoring-prometheus
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - gpu-node-1
