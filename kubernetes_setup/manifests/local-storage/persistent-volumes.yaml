---
# --- Verifier model cache ----------------------------------------------
# HuggingFace models pre-seeded by inf-ver-orchestrator seed Jobs; verifier
# LLMISvcs mount this via pvc:// instead of re-downloading per drain cycle.
# Eviction is manual: rm -rf /mnt/local-storage/hf-model-cache/<model> on the
# node (see README).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: hf-model-cache
  labels:
    app.kubernetes.io/part-of: infver-platform
spec:
  capacity:
    storage: 300Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    namespace: infver
    name: hf-model-cache
  local:
    path: /mnt/local-storage/hf-model-cache
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - gpu-node-1
