[project]
name = "ledger"
version = "0.1.0"
description = "Verification ledger access layer (FastAPI + SQLAlchemy async over psycopg3)"
requires-python = ">=3.11"
# Runtime deps mirror requirements.txt (kept for the Docker build).
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "psycopg[binary]>=3.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "testcontainers[postgres]>=4.0",
]

[tool.uv]
# This is an application, not an installable package — don't try to build it,
# just provision its dependencies into the venv.
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
