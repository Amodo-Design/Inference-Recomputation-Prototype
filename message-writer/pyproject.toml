[project]
name = "message-writer"
version = "0.1.0"
description = "Ingests tap messages and writes inference events to the ledger"
requires-python = ">=3.11"
# Runtime deps mirror requirements.txt (kept for the Docker build).
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.uv]
# Application, not a package — provision deps only.
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
