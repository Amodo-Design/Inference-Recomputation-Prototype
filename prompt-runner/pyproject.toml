[project]
name = "prompt-runner"
version = "0.1.0"
description = "In-cluster deterministic prompt suite runner for verification testing (vendored from an earlier standalone prompt-runner script)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "httpx>=0.27",
  "testcontainers[postgres]>=4.0",
]

[tool.ruff]
line-length = 120
